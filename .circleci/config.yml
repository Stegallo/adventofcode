version: 2.1

jobs:
  tests:
    docker:
      - image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - checkout
      - run:
          name: Install dependencies (uv installs Python 3.15 from .python-version)
          command: uv sync --dev --frozen
      - run:
          name: Run tests
          command: uv run pytest --cov-report xml --cov-report term --cov .
      - run:
          name: Upload coverage to Codecov
          command: |
            curl -Os https://cli.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov upload-process -Z || true
      - run:
          name: Run ruff
          command: uv run ruff check .
      # - run:
      #     name: Run mypy
      #     command: uv run mypy y_2015/*.py && uv run mypy y_2019/*.py
workflows:
  CI:
    jobs:
      - tests
