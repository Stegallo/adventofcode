name: CI
on:
  push:
    branches: [ master ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv installs the Python pinned in .python-version automatically.
      - run: uv sync --dev --frozen
      - run: uv run ruff check .
      - run: uv run pytest --cov-report=xml --cov-report=term --cov .
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          # Codecov is configured for tokenless uploads (public repo).
          fail_ci_if_error: false
